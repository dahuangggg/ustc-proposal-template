name: build

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译空白模板和压力文档
        run: sh tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf
          path: tests/build/*/main.pdf
